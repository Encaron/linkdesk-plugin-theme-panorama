<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48">
  <!-- theme-panorama 身份图「整窗主视觉」：月夜夜景装进一扇宽幅窗，暖金月为唯一亮点
       意象 = 该主题把整窗背景换成一张主视觉（sailor-moon.jpg 全窗低遮罩），故载体不做方块而做「窗」
       ——48 画布（正方形 viewBox 契约不变）里嵌一枚 40×28 横窗，是本家族唯一的宽幅载体
       家族：135° 双档渐变 + 白玻璃罩 + 发丝光边（Type-2 彩色身份图）；暖金取主题 accent #FFB85C -->
  <defs>
    <linearGradient id="pnSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#24304C"/>
      <stop offset="0.55" stop-color="#101827"/>
      <stop offset="1" stop-color="#090D14"/>
    </linearGradient>
    <linearGradient id="pnSheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.02"/>
    </linearGradient>
    <clipPath id="pnClip">
      <rect x="4" y="10" width="40" height="28" rx="5"/>
    </clipPath>
  </defs>

  <g clip-path="url(#pnClip)">
    <rect x="4" y="10" width="40" height="28" fill="url(#pnSky)"/>

    <!-- 星点 -->
    <g fill="#FFFFFF">
      <circle cx="11.5" cy="16.4" r="0.85" opacity="0.8"/>
      <circle cx="17.5" cy="21.2" r="0.65" opacity="0.6"/>
      <circle cx="23.5" cy="15.2" r="0.75" opacity="0.7"/>
      <circle cx="9.2" cy="23.6" r="0.55" opacity="0.5"/>
      <circle cx="20.5" cy="18.6" r="0.5" opacity="0.45"/>
    </g>

    <!-- 暖金月（光晕 + 实心盘） -->
    <circle cx="32.4" cy="19.6" r="8.8" fill="#FFB85C" opacity="0.16"/>
    <circle cx="32.4" cy="19.6" r="5.4" fill="#FFB85C"/>

    <!-- 远处天际线剪影（近黑，压在窗底） -->
    <path d="M4 38 V32.6 H7.6 V29.4 H11.2 V34.2 H14.8 V27.2 H18.4 V32.2 H22 V25.6 H25.6 V31.2 H29.2 V28.2 H32.8 V33.2 H36.4 V30.2 H40 V34.2 H44 V38 Z"
          fill="#05080E"/>
    <rect x="4" y="35.6" width="40" height="2.4" fill="#05080E" opacity="0.85"/>

    <!-- 白玻璃罩 -->
    <rect x="4" y="10" width="40" height="28" fill="url(#pnSheen)"/>
  </g>

  <!-- 窗框（发丝光边，暖金） -->
  <rect x="4.5" y="10.5" width="39" height="27" rx="4.5" fill="none" stroke="#FFB85C" stroke-opacity="0.35"/>
</svg>
